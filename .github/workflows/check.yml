name: Verify compiled application
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: realscan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-publisher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Windows publisher with real Node and Windows PowerShell
        shell: powershell
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts/windows-publish-regression.ps1
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run verify
      - name: Save compiled release and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realscan-build-and-audit
          path: |
            dist/
            .audit/print-usability/results.json
            .audit/print-usability/review-*.png
            .audit/service-flow/
            .audit/workbench-324/
            .audit/modern-326/
            .audit/annotations-327/
            .audit/cloud-recovery/
            .audit/image-enhance/
            .audit/workspace-polish/
            .audit/release329/
            .audit/operations330/
            .audit/counter335/
            .audit/review-settings/
            .audit/id-pdf-intake/
            .audit/mobile-local-evidence/
            .audit/mobile-local-webkit-evidence/
            .audit/counter-final/
            .audit/mobile-experience-chromium/
            .audit/mobile-experience-webkit/
            .audit/studio-320/results.json
            .audit/studio-320/home-desktop.png
            .audit/studio-320/workspace-1440.png
            .audit/studio-320/workspace-390.png
            .audit/studio-320/workspace-dark.png
            .audit/repair-evidence/regression.json
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
  backup-tag:
    needs: [regression, windows-publisher]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Create and verify immutable version backup tag
        run: node scripts/backup-tag.cjs
