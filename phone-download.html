<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RealScan — Descargar Archivos Digitales</title>
  <link rel="stylesheet" href="css/tailwind.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen p-4 flex flex-col items-center justify-center font-sans antialiased">
  <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-xl border border-slate-200 dark:border-slate-800 space-y-5">
    
    <!-- Cabecera -->
    <div class="text-center space-y-1 pb-3 border-b border-slate-100 dark:border-slate-800">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-emerald-50 dark:bg-emerald-950/70 text-emerald-600 dark:text-emerald-400 text-2xl shadow-xs mb-1">
        📥
      </div>
      <h1 class="text-xl font-bold text-slate-900 dark:text-white">Entrega Digital</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">Tus fotos y documentos escaneados listos para descargar</p>
      <div class="inline-block mt-1 px-2.5 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-[11px] font-mono font-semibold text-slate-600 dark:text-slate-300">
        Entrega: <span id="labelDeliveryId">Cargando...</span>
      </div>
    </div>

    <!-- Lista de Archivos para Descargar -->
    <div id="deliveryFilesContainer" class="space-y-3">
      <div id="deliveryFilesList" class="space-y-2">
        <p class="text-xs text-center text-slate-400 py-4">Buscando archivos de la entrega...</p>
      </div>
    </div>

    <!-- Pie Informativo -->
    <div class="text-center pt-2 border-t border-slate-100 dark:border-slate-800">
      <p class="text-[10px] text-slate-400">🔒 Descarga privada directa • Verifica tamaño y resolución antes de imprimir • Desarrollado por Paco Iglesias</p>
    </div>
  </div>

  <script src="js/phone-session.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase-transfer.js"></script>
  <script src="js/phone-download.js"></script>
</body>
</html>
